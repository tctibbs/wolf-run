[project]
name = "wolf-run"
version = "0.1.0"
description = "A Halloween game for a Raspberry Pi: a clock with a sleeping wolf, a retro runner where you play the Big Bad Wolf, and a live camera at the end."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tristan Tibbs" }]
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless>=4.9,<5",
    "python-dotenv>=1.0",
]

[project.urls]
Repository = "https://github.com/tctibbs/wolf-run"

[project.scripts]
wolf-run = "wolf_run.cli:main"

[dependency-groups]
dev = [
    "pyqt5>=5.15",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wolf_run"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=wolf_run --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["src/wolf_run"]
